<!DOCTYPE html>
<html>


<link rel="stylesheet" href="calculator.css">

<body>
    <!-- <h2>Simple calculator</h2> -->

    <div class="calculator">
       
        <div class="display" id="display" style="font-size: 50px;">0</div>
        <div class="button row">
            <div class="column">
                
                <button class="btn" id="one">1</button>
                <button class="btn" id="four">4</button>
                <button class="btn" id="seven">7</button>
                <button class="btn" id="zero">0</button>
            </div>

            <div class="column">
                <button class="btn" id="two">2</button>
                <button class="btn" id="five">5</button>
                <button class="btn" id="eight">8</button>
                <div class="redbutton">
                <button class="btn redbutton"  id="clear">AC</button>
                </div>
                
            </div>

            <div class="column">
                <button class="btn" id="three">3</button>
                <button class="btn" id="six">6</button>
                <button class="btn" id="nine">9</button>
                <button class="btn" style="color: orange; font-size: 30px;" id="equal">=</button>
            </div>

             <div class="column">
            
                <button class="btn" id="sub">-</button>
                <button class="btn" id="multiply">*</button>
                <button class="btn" id="div">/</button>
                <button class="btn" id="add">+</button>
                
            </div>

           

            </div>

            <div class="column">
                <button class="decimal" id="dot" style="font-size: 30px;">
                    .
                </button>
               
            </div>

            <!-- backspace button -->

            <div class="space">
                <button class="arrow" id="backspace" >
                    <img src="backspace.png" >
                </button>
            </div>

           
        


    </div>
    <script src="script.js"></script>
</body>
</html>
